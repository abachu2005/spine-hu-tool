name: Build installers

# One tag push -> three native installers, published to a GitHub Release
# (the "install via cloud" download page physicians visit).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GUI test system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    # Surface the gating secrets as env so step `if:` conditions can check them.
    # Empty when the secret is unset -> the optional signing steps are skipped.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      # Full offline build: the per-OS packagers copy this prebuilt local-seg
      # runtime (env + weights) into the app so segmentation runs offline with
      # zero setup. Empty -> lean cloud-only build.
      SPINE_HU_LOCALSEG_BUNDLE: ${{ github.workspace }}/packaging/localseg-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-dmg
          - os: windows-latest
            artifact: windows-setup
          - os: ubuntu-latest
            artifact: linux-appimage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A build that advertises one version while stamping another into its
      # reproducibility.json is worse than a build that fails, so check first.
      - name: Check version consistency
        shell: bash
        run: |
          # On a tag build the tag is the release identity, so require the code
          # to agree with it as well as with the packaging files.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "release tags must use vMAJOR.MINOR.PATCH" >&2
              exit 1
            }
            python packaging/sync_version.py --check --expect "${GITHUB_REF_NAME#v}"
          else
            python packaging/sync_version.py --check
          fi

      - name: Install client + build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # core client deps only (NO torch / TotalSegmentator)
          pip install .
          pip install pyinstaller pillow

      - name: Generate icons
        shell: bash
        run: python packaging/make_icons.py

      # Build the self-contained torch + TotalSegmentator runtime + weights that
      # the offline installer ships. Heavy (multi-GB); does NOT run inference.
      # Free up disk first so the weights fit on the runner.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h || true

      - name: Build local-seg runtime + weights
        shell: bash
        run: |
          python packaging/build_localseg_env.py --out packaging/localseg-bundle
          du -sh packaging/localseg-bundle || true

      - name: Build app bundle (PyInstaller)
        shell: bash
        run: |
          pyinstaller packaging/spine_hu.spec --noconfirm \
            --distpath packaging/dist --workpath packaging/build

      # Windows: the mac/linux packager scripts copy the runtime themselves, but
      # the Windows path runs Inno Setup directly, so bundle here (before iscc).
      - name: Bundle local-seg runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python packaging/bundle_localseg.py --app "packaging/dist/Spine HU Tool"

      # ---- macOS: optional signing, then .dmg ---------------------------
      # Signing runs only when the cert secret is configured (see
      # packaging/SIGNING.md); otherwise the app ships unsigned.
      - name: Sign .app (macOS, optional)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --deep --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "packaging/dist/Spine HU Tool.app"

      - name: Build .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install create-dmg || true
          bash packaging/macos/build_dmg.sh
          mkdir -p artifacts
          mv "packaging/dist/Spine HU Tool.dmg" "artifacts/SpineHUTool-macos.dmg"

      - name: Notarize .dmg (macOS, optional)
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "artifacts/SpineHUTool-macos.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "artifacts/SpineHUTool-macos.dmg"

      # ---- Windows: optional signing + Inno Setup wizard ---------------
      - name: Decode signing cert (Windows, optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))

      - name: Sign app exe (Windows, optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "packaging\dist\Spine HU Tool\Spine HU Tool.exe"

      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      - name: Build setup.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Move-Item "packaging\dist\SpineHUTool-Setup.exe" "artifacts\SpineHUTool-windows-setup.exe"

      - name: Sign setup.exe (Windows, optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "artifacts\SpineHUTool-windows-setup.exe"

      # ---- Linux: AppImage ---------------------------------------------
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils
          bash packaging/linux/build_appimage.sh
          mkdir -p artifacts
          mv packaging/dist/SpineHUTool-x86_64.AppImage artifacts/SpineHUTool-linux-x86_64.AppImage

      # Gate the release on the bundled runtime working OFF the build machine:
      # verify_build.py health-checks the runtime in situ, then copies it to a
      # temp path containing spaces with uv's python store hidden and re-checks
      # (catches non-relocatable bundles like v0.2.0, which passed in situ).
      - name: Verify offline bundle (simulated user machine)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            APP="packaging/dist/Spine HU Tool.app"
          else
            APP="packaging/dist/Spine HU Tool"
          fi
          python packaging/verify_build.py --app "$APP"

      # Upload this OS's installer straight to its immutable GCS release path.
      # The offline installers are
      # multi-GB -- far too large for GitHub's artifact storage (it hits the
      # account quota) or a GitHub Release (2 GB/file limit) -- so each build job
      # uploads its own file. A final job promotes latest and the download page
      # only after all three native builds have succeeded.
      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Upload installer to GCS
        if: ${{ env.GCP_SA_KEY != '' }}
        shell: bash
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          set -euo pipefail
          B="gs://$GCS_BUCKET"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="manual-${GITHUB_RUN_NUMBER}"
          fi
          shopt -s nullglob
          for f in artifacts/*; do
            name="$(basename "$f")"
            echo "Uploading $name -> $B/$VER/"
            gcloud storage cp "$f" "$B/$VER/$name" \
              --cache-control="public, max-age=3600" --if-generation-match=0
          done

  publish:
    name: Publish installers and download page
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: spine-hu-live-publish
      cancel-in-progress: false
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Require publishing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY"
          test -n "$GCS_BUCKET"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Verify and promote release
        shell: bash
        run: |
          set -euo pipefail
          B="gs://$GCS_BUCKET"
          VER="$GITHUB_REF_NAME"
          CURRENT="$(
            gcloud storage cat "$B/version.json" 2>/dev/null |
              python -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))'
          )" || CURRENT=""
          set +e
          python - "$CURRENT" "${VER#v}" <<'PY'
          import sys

          def version_tuple(value):
              return tuple(int(part) for part in value.split("."))

          current, candidate = sys.argv[1:3]
          if current and version_tuple(current) > version_tuple(candidate):
              print(f"newer live v{current} exists; skipping stale v{candidate}")
              raise SystemExit(3)
          PY
          version_status=$?
          set -e
          if [[ "$version_status" -eq 3 ]]; then
            exit 0
          fi
          test "$version_status" -eq 0
          artifacts=(
            SpineHUTool-macos.dmg
            SpineHUTool-windows-setup.exe
            SpineHUTool-linux-x86_64.AppImage
          )
          for name in "${artifacts[@]}"; do
            gcloud storage ls "$B/$VER/$name"
          done
          for name in "${artifacts[@]}"; do
            gcloud storage cp "$B/$VER/$name" "$B/latest/$name" \
              --cache-control="public, max-age=3600"
          done
          gcloud storage cp packaging/download/index.html "$B/index.html" \
            --cache-control="no-cache"
          gcloud storage cp packaging/icons/spine_hu.png "$B/icon.png" \
            --cache-control="public, max-age=86400"
          # Metadata is the release pointer and is intentionally published last.
          gcloud storage cp packaging/download/version.json "$B/version.json" \
            --cache-control="no-cache"
          echo "Published. Download page: https://storage.googleapis.com/$GCS_BUCKET/index.html"

  # Lightweight GitHub Release for the changelog/tag record only. The installers
  # live on GCS (too large for release assets), so no files are attached here.
  release:
    name: Publish GitHub Release (notes only)
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Spine HU Tool — desktop installers

            Download the installer for your OS from the download page
            (installers are hosted there, not attached here):
            https://storage.googleapis.com/${{ secrets.GCS_BUCKET }}/index.html

            - **macOS**: `SpineHUTool-macos.dmg` (open, drag to Applications)
            - **Windows**: `SpineHUTool-windows-setup.exe` (setup wizard)
            - **Linux**: `SpineHUTool-linux-x86_64.AppImage` (mark executable, run)

            Segmentation runs fully offline on your computer (no upload needed);
            a cloud option is also available. **Pilot / non-PHI use only.**
